<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイセトリ再生 | Live Archive Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
</head>
<body class="bg-[#f7f3e9] p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg">

        <h1 id="setlist-title" class="text-xl md:text-2xl font-bold mb-4 text-center border-b pb-4 text-gray-800">Loading...</h1>

        <div id="notLoggedIn" class="text-center py-10 hidden">
            <p class="text-gray-700 mb-4">このセトリを再生するにはログインが必要です。</p>
            <a href="login.html" class="inline-block bg-blue-700 text-white px-4 py-2 rounded font-bold hover:bg-blue-800">ログインページへ</a>
        </div>

        <div id="playerArea" class="hidden">
            <div id="player" class="aspect-video w-full mb-4 rounded overflow-hidden bg-black"></div>

            <div class="bg-gray-50 border border-gray-100 p-3 rounded-md mb-6 text-sm text-gray-500">
                現在再生中：<span id="current-title" class="font-bold text-blue-600">未選択</span>
            </div>

            <h3 class="text-lg font-bold mb-3 text-gray-700 border-l-4 border-blue-500 pl-2">Setlist</h3>
            <ul id="setlist" class="space-y-2"></ul>

            <div class="grid grid-cols-2 gap-4 mt-8 pt-6 border-t border-gray-100">
                <button onclick="playNextSong()" class="bg-[#334155] text-white py-3 rounded-md font-bold shadow-md active:scale-95 transition">
                    次の曲へ
                </button>
                <button onclick="playRandomSong()" class="bg-[#64748b] text-white py-3 rounded-md font-bold shadow-md active:scale-95 transition">
                    ランダム
                </button>

                <a href="mypage.html" class="col-span-2 text-center text-gray-500 text-sm py-2 hover:underline">
                    マイページに戻る
                </a>
            </div>
        </div>
    </div>

    <script>
        let player;
        let songsData = [];
        let currentTrackIndex = 0;
        const urlParams = new URLSearchParams(window.location.search);
        const setlistId = urlParams.get('setlist');

        function onYouTubeIframeAPIReady() {
            initPlayer();
        }

        async function initPlayer() {
            if (!setlistId || !window.sb) return;

            const { data: { session } } = await window.sb.auth.getSession();
            if (!session) {
                document.getElementById('notLoggedIn').classList.remove('hidden');
                document.getElementById('setlist-title').textContent = 'ログインが必要です';
                return;
            }

            const { data: setlist, error: setlistError } = await window.sb
                .from('custom_setlists')
                .select('id, name')
                .eq('id', setlistId)
                .single();

            if (setlistError || !setlist) {
                document.getElementById('setlist-title').textContent = 'セトリが見つかりません';
                return;
            }

            const { data: items, error: itemsError } = await window.sb
                .from('custom_setlist_items')
                .select('song_title, video_id, position')
                .eq('setlist_id', setlistId)
                .order('position', { ascending: true });

            if (itemsError || !items || items.length === 0) {
                document.getElementById('setlist-title').textContent = setlist.name;
                document.getElementById('playerArea').classList.remove('hidden');
                document.getElementById('setlist').innerHTML = '<li class="text-sm text-gray-400">まだ曲が入っていません。マイページから追加してください。</li>';
                return;
            }

            songsData = items.map(i => ({ title: i.song_title, id: i.video_id }));
            document.getElementById('setlist-title').textContent = setlist.name;
            document.getElementById('playerArea').classList.remove('hidden');

            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: songsData[0].id,
                playerVars: { 'playsinline': 1 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });

            const list = document.getElementById('setlist');
            list.innerHTML = '';
            songsData.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = "p-3 bg-white border border-gray-100 rounded-lg shadow-sm flex justify-between items-center cursor-pointer hover:bg-blue-50 transition duration-200";
                li.innerHTML = `
                    <span class="text-gray-700 font-medium">${index + 1}. ${track.title}</span>
                    <button class="bg-blue-600 text-white text-[10px] px-3 py-1 rounded-full uppercase tracking-tighter">再生</button>
                `;
                li.onclick = () => {
                    currentTrackIndex = index;
                    playSelectedTrack();
                };
                list.appendChild(li);
            });
        }

        function onPlayerReady() {
            // 最初の曲はYT.Player生成時に既に読み込み済み
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                playNextSong();
            }
        }

        function playNextSong() {
            if (currentTrackIndex < songsData.length - 1) {
                currentTrackIndex++;
            } else {
                currentTrackIndex = 0;
            }
            playSelectedTrack();
        }

        function playRandomSong() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * songsData.length);
            } while (newIndex === currentTrackIndex && songsData.length > 1);
            currentTrackIndex = newIndex;
            playSelectedTrack();
        }

        function playSelectedTrack() {
            if (!player || !player.loadVideoById) return;
            const track = songsData[currentTrackIndex];
            player.loadVideoById(track.id);
            document.getElementById('current-title').innerText = track.title;
            updateHighlight(currentTrackIndex);
        }

        function updateHighlight(index) {
            const listItems = document.querySelectorAll('#setlist li');
            listItems.forEach(el => el.classList.remove('border-blue-400', 'bg-blue-50'));
            if (listItems[index]) {
                listItems[index].classList.add('border-blue-400', 'bg-blue-50');
            }
        }
    </script>
</body>
</html>
