<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | Live Archive Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <style>
        body {
            font-family: 'Sawarabi+Mincho', serif;
            background-color: #f7f3e9;
        }
        .paper-card {
            box-shadow: 2px 4px 15px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <header class="text-center mb-12">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 tracking-widest">
            ♪ Live Archive Log
        </h1>
        <p class="mt-3 text-gray-600 italic text-sm">ログインしてマイページを使う</p>
    </header>

    <main class="max-w-md mx-auto">
        <div class="paper-card bg-white p-8 rounded-sm border-l-4 border-blue-200">

            <div id="loggedOutView">
                <h2 class="text-lg font-bold text-blue-900 mb-4">メールアドレスでログイン</h2>
                <p class="text-sm text-gray-500 mb-4">パスワードは不要です。入力したメールアドレス宛にログイン用リンクが届きます。</p>
                <form id="loginForm" class="flex flex-col gap-3">
                    <input id="emailInput" type="email" required placeholder="you@example.com"
                        class="border border-gray-300 rounded px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-300">
                    <button type="submit" id="submitBtn"
                        class="bg-blue-700 text-white px-4 py-2 rounded font-bold hover:bg-blue-800">
                        ログインリンクを送る
                    </button>
                </form>
                <p id="loginMessage" class="mt-4 text-sm"></p>
            </div>

            <div id="loggedInView" class="hidden">
                <p class="text-gray-700 mb-4">すでにログインしています（<span id="loggedInEmail" class="font-bold"></span>）。</p>
                <a href="mypage.html" class="inline-block bg-blue-700 text-white px-4 py-2 rounded font-bold hover:bg-blue-800">マイページへ</a>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-100 text-center">
                <a href="index.html" class="text-gray-500 text-sm hover:underline">&laquo; 一覧に戻る</a>
            </div>
        </div>
    </main>

    <script>
    (function () {
        const loggedOutView = document.getElementById('loggedOutView');
        const loggedInView = document.getElementById('loggedInView');
        const loggedInEmail = document.getElementById('loggedInEmail');
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('emailInput');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('loginMessage');

        async function checkSession() {
            if (!window.sb) return;
            const { data: { session } } = await window.sb.auth.getSession();
            if (session) {
                loggedOutView.classList.add('hidden');
                loggedInView.classList.remove('hidden');
                loggedInEmail.textContent = session.user.email;
            } else {
                loggedOutView.classList.remove('hidden');
                loggedInView.classList.add('hidden');
            }
        }

        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!window.sb) {
                    messageEl.textContent = 'Supabaseへの接続に失敗しました。';
                    messageEl.className = 'mt-4 text-sm text-red-600';
                    return;
                }
                const email = emailInput.value.trim();
                if (!email) return;
                submitBtn.disabled = true;
                messageEl.textContent = '送信中…';
                messageEl.className = 'mt-4 text-sm text-gray-500';
                const { error } = await window.sb.auth.signInWithOtp({
                    email,
                    options: {
                        emailRedirectTo: window.location.origin + window.location.pathname.replace(/login\.html$/, 'mypage.html')
                    }
                });
                submitBtn.disabled = false;
                if (error) {
                    messageEl.textContent = '送信に失敗しました：' + error.message;
                    messageEl.className = 'mt-4 text-sm text-red-600';
                } else {
                    messageEl.textContent = 'メールを送信しました。届いたリンクをクリックしてログインしてください。';
                    messageEl.className = 'mt-4 text-sm text-green-700';
                }
            });
        }

        checkSession();
        if (window.sb) {
            window.sb.auth.onAuthStateChange(() => checkSession());
        }
    })();
    </script>
</body>
</html>
